<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEMCOR Trivia - Host</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a1a; color: white; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #ff0055; font-size: 3rem; }
        .container { max-width: 1200px; margin: 0 auto; }
        .question-box { background-color: #333; padding: 40px; border-radius: 20px; margin-top: 50px; box-shadow: 0 0 20px rgba(255, 0, 85, 0.5); }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .option { background-color: #444; padding: 20px; border-radius: 10px; font-size: 1.5rem; }
        .option.correct { background-color: #28a745; }
        .btn { padding: 15px 30px; font-size: 1.5rem; cursor: pointer; background-color: #ff0055; color: white; border: none; border-radius: 10px; margin-top: 20px; }
        .btn:hover { background-color: #cc0044; }
        #status { font-size: 1.5rem; margin-top: 20px; color: #aaa; }
        .leaderboard { background-color: #333; padding: 40px; border-radius: 20px; margin-top: 50px; display: none; }
        .leaderboard li { font-size: 2rem; list-style: none; margin: 10px 0; border-bottom: 1px solid #555; padding-bottom: 10px; }
        .leaderboard li:first-child { color: gold; font-weight: bold; font-size: 2.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>GEMCOR x IIEE Trivia</h1>
        
        <div id="waiting-screen">
            <h2>Waiting for players...</h2>
            <p>Players Connected: <span id="player-count">0</span></p>
            <button class="btn" id="start-btn" onclick="startGame()">Start Game</button>
        </div>

        <div id="game-screen" style="display: none;">
            <div class="question-box">
                <h2 id="question-text">Question here</h2>
                <div class="options" id="options-container">
                    <!-- Options will be injected here -->
                </div>
            </div>
            <p id="status">Waiting for answers...</p>
            <button class="btn" id="reveal-btn" onclick="revealAnswer()" style="display: none;">Reveal Answer</button>
            <button class="btn" id="next-btn" onclick="nextQuestion()" style="display: none;">Next Question</button>
        </div>

        <div id="leaderboard-screen" class="leaderboard">
            <h2>Top 5 Players</h2>
            <ul id="leaderboard-list"></ul>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentQuestionData = null;

        socket.on('updatePlayerCount', (count) => {
            document.getElementById('player-count').innerText = count;
        });

        socket.on('newQuestion', (data) => {
            currentQuestionData = data;
            document.getElementById('waiting-screen').style.display = 'none';
            document.getElementById('leaderboard-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('question-text').innerText = data.question;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            data.options.forEach((opt, index) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerText = `${String.fromCharCode(65 + index)}. ${opt}`; // A, B, C, D
                div.id = `opt-${index}`;
                optionsContainer.appendChild(div);
            });

            document.getElementById('status').innerText = 'Waiting for answers...';
            document.getElementById('reveal-btn').style.display = 'inline-block';
            document.getElementById('next-btn').style.display = 'none';
        });

        socket.on('updateAnsweredCount', (count) => {
            document.getElementById('status').innerText = `Answers received: ${count}`;
        });

        socket.on('showResults', (data) => {
            const correctIndex = data.correctAnswer;
            document.getElementById(`opt-${correctIndex}`).classList.add('correct');
            document.getElementById('reveal-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'inline-block';
        });

        socket.on('gameOver', (leaderboard) => {
            document.getElementById('game-screen').style.display = 'none';
            const lbScreen = document.getElementById('leaderboard-screen');
            lbScreen.style.display = 'block';
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '';
            leaderboard.forEach(player => {
                const li = document.createElement('li');
                li.innerText = `${player.name} - ${player.score} pts`;
                list.appendChild(li);
            });
        });

        function startGame() {
            socket.emit('startGame');
        }
        function revealAnswer() {
            socket.emit('revealAnswer');
        }
        function nextQuestion() {
            socket.emit('nextQuestion');
        }
    </script>
</body>
</html>
